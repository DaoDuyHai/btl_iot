name: Smart Library Kiosk CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =====================================================
  # 1. Job Linting, Unit Testing & Build (CI)
  # =====================================================
  build-and-test:
    name: Lint, Test & Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # 1. Cài đặt root và chạy Linting kiểm tra chuẩn mã nguồn
      - name: Install Root Dependencies & Run Linter
        run: |
          npm ci
          npm run lint

      # 2. Cài đặt Backend và chạy Test Suite với Coverage (Vitest + Supertest)
      - name: Run Backend Tests & Coverage
        run: |
          cd server
          npm ci
          npm run test:coverage

      # 3. Cài đặt Frontend và biên dịch ứng dụng React SPA
      - name: Install & Build Frontend
        run: |
          cd client
          npm ci
          npm run build

      # 4. Kiểm tra đóng gói Docker Images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: ptit-library-kiosk-server:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: ptit-library-kiosk-client:latest

  # =====================================================
  # 2. Job Tự động Triển khai Backend lên Fly.io (CD)
  # =====================================================
  deploy-backend:
    name: Deploy Backend to Fly.io
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        if: env.FLY_API_TOKEN != ''
        run: |
          cd server
          flyctl deploy --remote-only
