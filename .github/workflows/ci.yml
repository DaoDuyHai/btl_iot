name: Smart Library Kiosk CI Pipeline (Lint & Test)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =====================================================
  # 1. Job Linting, Unit Testing & Build (CI)
  # =====================================================
  build-and-test:
    name: Lint, Test & Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # 1. Cài đặt root và chạy Linting kiểm tra chuẩn mã nguồn
      - name: Install Root Dependencies & Run Linter
        run: |
          npm ci
          npm run lint

      # 2. Cài đặt Backend và chạy Test Suite với Coverage (Vitest + Supertest)
      - name: Run Backend Tests & Coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_kiosk
        run: |
          cd server
          npm ci
          npm run test:coverage

      # 3. Cài đặt Frontend và biên dịch ứng dụng React SPA
      - name: Install & Build Frontend
        run: |
          cd client
          npm ci
          npm run build

      # 4. Kiểm tra đóng gói Docker Images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: ptit-library-kiosk-server:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: ptit-library-kiosk-client:latest
