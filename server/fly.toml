app = 'ptit-library-kiosk-server'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  BANK_ACCOUNT = '000124135246'
  BANK_BIN = '970422'
  FINE_PER_DAY_VND = '5000'
  KIOSK_DEVICE_ID = 'kiosk_01'
  PORT = '5000'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
